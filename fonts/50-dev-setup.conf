<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Linked to ~/.config/fontconfig/conf.d by scripts/fonts.sh.
     Pins the generic families so every machine resolves them the same way
     instead of by whichever font package happens to win. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <!-- Nerd font after the text font: only used for icon glyphs (nvim devicons) -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>FantasqueSansM Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
